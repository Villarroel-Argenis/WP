name: CI

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  COVERAGE_THRESHOLD: 85

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - run: dotnet restore

      - run: dotnet build --no-restore --configuration Release

      - name: Test con cobertura
        run: dotnet test --no-build --configuration Release --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Instalar ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generar reporte
        run: reportgenerator -reports:"./coverage/**/coverage.cobertura.xml" -targetdir:"./coverage/report" -reporttypes:"Html;Cobertura"

      - name: Verificar umbral de cobertura
        run: |
          LINE_RATE=$(grep -oP '(?<=line-rate=")[^"]+' ./coverage/report/Cobertura.xml | head -1)
          PERCENTAGE=$(awk "BEGIN {printf \"%.0f\", $LINE_RATE * 100}")
          echo "Line coverage: $PERCENTAGE%"
          if [ "$PERCENTAGE" -lt "$COVERAGE_THRESHOLD" ]; then
            echo "❌ Coverage $PERCENTAGE% está por debajo del umbral $COVERAGE_THRESHOLD%"
            exit 1
          fi
          echo "✅ Coverage $PERCENTAGE% cumple el umbral $COVERAGE_THRESHOLD%"

      - name: Subir reporte como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./coverage/report
