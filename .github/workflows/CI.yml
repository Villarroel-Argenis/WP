name: CI

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - run: dotnet restore

      - run: dotnet build --no-restore --configuration Release

      - name: Test con cobertura
        run: |
          dotnet test --no-build --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Threshold=90 \
            DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.ThresholdType=Line \
            DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.ThresholdStat=Total


      - name: Instalar ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generar reporte
        run: reportgenerator -reports:"./coverage/**/coverage.cobertura.xml" -targetdir:"./coverage/report" -reporttypes:"Html;Cobertura"

      - name: Subir reporte como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./coverage/report
